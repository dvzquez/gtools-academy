<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTools Academy</title>
  <meta name="description" content="Cursos prácticos de herramientas de Google para maestros y alumnos. Practical Google tools courses for teachers and students.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="#">GTools Academy</a>
  <nav aria-label="Menu">
    <a href="#cursos" data-i18n="nav_courses"></a>
    <a href="#ruta" data-i18n="nav_roadmap"></a>
    <a href="#reconocimiento" data-i18n="nav_award"></a>
    <a href="#contacto" data-i18n="nav_contact"></a>
  </nav>
  <input id="q" type="search" data-i18n-ph="search">
  <div class="tools">
    <button id="lang" type="button" class="ghost"></button>
    <button id="theme" type="button" class="ghost"></button>
    <button id="login" type="button" class="ghost"></button>
    <button id="register" type="button" class="solid"></button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="arch" id="arch">
      <div class="ph" data-i18n="video_ph"></div>
      <video id="welcome" autoplay muted loop playsinline>
        <source src="assets/video/bienvenida.mov" type='video/quicktime; codecs="hvc1"'>
        <source src="assets/video/bienvenida.webm" type="video/webm">
      </video>
      <svg class="swirl" viewBox="0 0 400 160" aria-hidden="true"><path d="M10 90C60 20 340 10 390 70S300 150 140 135 20 120 120 60"/></svg>
      <button id="sound" type="button" hidden>🔇</button>
    </div>
    <h1>GTools Academy</h1>
    <p data-i18n="hero_sub"></p>
    <a class="solid" href="#cursos" data-i18n="cta"></a>
  </section>

  <section id="cursos">
    <h2 data-i18n="nav_courses"></h2>
    <div class="filters">
      <div class="chips" role="group">
        <button class="chip" data-cat="all" aria-pressed="true" data-i18n="cat_all"></button>
        <button class="chip" data-cat="populares" aria-pressed="false" data-i18n="cat_pop"></button>
        <button class="chip" data-cat="poco-conocidas" aria-pressed="false" data-i18n="cat_rare"></button>
      </div>
      <select id="level" aria-label="Level">
        <option value="all" data-i18n="lvl_all"></option>
        <option value="basico" data-i18n="lvl_basico"></option>
        <option value="intermedio" data-i18n="lvl_intermedio"></option>
        <option value="avanzado" data-i18n="lvl_avanzado"></option>
      </select>
      <select id="aud" aria-label="Audience">
        <option value="all" data-i18n="aud_all"></option>
        <option value="maestros" data-i18n="aud_maestros"></option>
        <option value="alumnos" data-i18n="aud_alumnos"></option>
        <option value="general" data-i18n="aud_general"></option>
      </select>
    </div>
    <p id="count" class="note" aria-live="polite"></p>
    <div id="courses" class="grid"></div>
    <p id="empty" class="empty" hidden data-i18n="empty"></p>
  </section>

  <section id="ruta">
    <h2 data-i18n="nav_roadmap"></h2>
    <p class="note" data-i18n="road_sub"></p>
    <ol id="roadmap" class="road"></ol>
  </section>

  <section id="reconocimiento">
    <h2 data-i18n="nav_award"></h2>
    <p class="note" data-i18n="award_text"></p>
    <ul id="awards"></ul>
  </section>

  <section id="contacto">
    <h2 data-i18n="nav_contact"></h2>
    <p class="note" data-i18n="contact_sub"></p>
    <form id="contact-form" class="form">
      <label><span data-i18n="name_label"></span><input name="name" required minlength="2" maxlength="80" autocomplete="name"></label>
      <label><span data-i18n="email_label"></span><input name="email" type="email" required maxlength="120" autocomplete="email"></label>
      <label><span data-i18n="role_label"></span>
        <select name="role" required>
          <option value="maestro" data-i18n="role_maestro"></option>
          <option value="alumno" data-i18n="role_alumno"></option>
          <option value="otro" data-i18n="role_otro"></option>
        </select>
      </label>
      <label><span data-i18n="msg_label"></span><textarea name="message" required minlength="10" maxlength="1000" rows="5"></textarea></label>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="solid" data-i18n="send"></button>
      <p id="form-status" class="note" role="status"></p>
    </form>
  </section>
</main>

<footer class="foot"><small data-i18n="footer"></small><br><small id="source"></small></footer>

<dialog id="dlg-auth">
  <form id="auth-form" method="dialog">
    <h2 id="auth-title"></h2>
    <label><span data-i18n="name_label"></span><input id="auth-name" required autocomplete="name"></label>
    <button class="solid" value="ok" data-i18n="google"></button>
    <button class="ghost" value="cancel" formnovalidate data-i18n="close"></button>
    <p class="note" data-i18n="auth_note"></p>
  </form>
</dialog>
<dialog id="dlg-course"><div id="course-body"></div></dialog>
</body>
</html>
